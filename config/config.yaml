amazon_scraper:
  mode: "playwright"
  # Stage 1 writes data/<basename> — overwritten on each Stage 1 run (use --force to re-scrape)
  raw_books_json: "amazon_raw.json"
  amazon_base: "https://www.amazon.com"
  max_pages_per_pool: 10
  delay_between_pages: 12
  delay_between_requests: 3.0
  use_headless: true
  viewport_width_range: [1280, 1440]
  viewport_height_range: [820, 980]
  human_scroll_steps: 4
  # Narrow terms; Stage 1 builds queries like "{category} {keyword} book author"
  pool_a_keywords: ["entrepreneurship", "startup", "founder", "small business", "scaling a business"]
  pool_b_keywords: ["pre-order", "coming soon", "launching soon"]

linkdapi:
  api_key: ""
  geo_urn_usa: "103644278"

pipeline:
  pool_a_date_range_months: [12, 36]
  pool_b_preorder_days: 60
  review_threshold_a: [10, 120]
  review_threshold_b: [0, 20]
  max_followers: 5000
  min_score_to_keep: 5
  non_fiction_gate_enabled: false
  non_fiction_include_keywords:
    - "non fiction"
    - "non-fiction"
    - "nonfiction"
  non_fiction_exclude_keywords:
    - "fiction"
    - "novel"
    - "romance"
    - "fantasy"
    - "science fiction"
    - "sci-fi"
    - "thriller"
    - "mystery"
    - "young adult"
    - "ya"
    - "paranormal"
    - "dystopian"
  categories:
    - "Business & Economics"

# Stage 1.5: optional public email enrichment (run with --stage 1.5 or --stage 1,1.5)
email_enrichment:
  enabled: true
  use_headless: true
  concurrency: 2
  delay_seconds_min: 2.0
  delay_seconds_max: 4.5
  navigation_timeout_ms: 25000
  max_urls_per_author: 8
  max_ddg_results: 6
  use_author_central: true
  use_ddg_fallback: true
  # If no personal email on site (or only info@/hello@), try local-part patterns + DDG snippet hit (unverified).
  use_domain_guess: true
  guess_max_patterns: 8
  guess_max_ddg_results: 3
  # Truth Reactor: set smtp_verification_enabled false if outbound SMTP is blocked
  smtp_verification_enabled: true
  smtp_timeout_seconds: 15.0
  smtp_catchall_timeout_seconds: 12.0
  reactor_list_update_interval_seconds: 604800
  reactor_cache_db: ""
  reactor_list_dir: ""

scoring:
  profession:
    ceo_founder_investor: 3
    vp_cto_doctor_engineer: 2
    other_high_income: 1
  reviews:
    10_20: 2
    21_40: 1
  location: 1
  visibility:
    low: 2
    medium: 1
    high: 0
